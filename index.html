<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>Fractions</title>
<!-- Computer Modern (the LaTeX font). Falls back to a serif font when offline. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
<style>
  :root { --bg: #0b0b0d; --serif: "Computer Modern Serif", "CMU Serif", "Latin Modern Roman", "Times New Roman", Georgia, serif; }
  html, body { margin: 0; background: var(--bg); touch-action: manipulation; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #wrap { position: relative; max-width: 1200px; margin: 0 auto; }
  svg { display: block; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; font-family: var(--serif); }
  .hit { cursor: pointer; }
  .drag { cursor: ew-resize; }
  .den { position: absolute; transform: translate(-50%, -50%); box-sizing: border-box;
         border: none; background: transparent; text-align: center; font-weight: 400;
         font-family: var(--serif); padding: 0; border-radius: 6px; outline: none; caret-color: currentColor; }
  .den:hover { background: #1b1b20; }
  .den:focus { background: #1b1b20; box-shadow: 0 0 0 1.5px currentColor; }
</style>
</head>
<body>
<div id="wrap"><svg id="s"></svg></div>
<script>
// ---------- style (colors of the 3Blue1Brown animation library) ----------
const COLORS = ['#58C4DD', '#F7D96F', '#83C167', '#FC6255', '#9A72AC'];   // blue, yellow, green, red, purple
const FG = '#ECECEC', DIM = '#6b6b74', FAINT = '#2c2c33', FILL_OP = 0.55;
const NS = 'http://www.w3.org/2000/svg';
const TOP = 12, MAX_D = 100, MAX_M = 30;
// Vertical sizes. layout() scales them so the whole drawing fits the screen height.
let ROW = 88, BAR_H = 44, ADD_H = 52, CROW = 88, CR = 36, DY = 20;
const wrap = document.getElementById('wrap');
const svg = document.getElementById('s');

// ---------- state ----------
// n / d = fraction, c = color index, sv = shown value (moves smoothly toward n / d)
let fr = [{ n: 3, d: 4, c: 0, sv: 0.75 }];
let M = 1, Mt = 1;                  // visible wholes on the number line, and its target
let LY = 0;                         // y of the number line (set in render)
let active = 0;                     // fraction drawn on top
let drag = null;                    // { i, px } while a dot is dragged
let tap = null;                     // pending button / piece tap
let running = false, last = 0;     // animation loop
let L = {};                         // layout in CSS pixels (1 SVG unit = 1 px)
const inputs = new Map();           // fraction object -> <input> for its denominator

// ---------- layout ----------
function layout() {
  const W = Math.max(320, wrap.clientWidth);
  const compact = W < 640;
  const sx = compact ? 66 : 92;           // center of the fraction symbol
  const bo = compact ? 42 : 52;           // distance from symbol to − / + buttons

  // Fit the height: fixed part (number line + labels + margins) and a part that grows with v.
  const cs = getComputedStyle(document.body);
  const availH = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const n = fr.length;
  const FIXED = TOP + 36 + 64 + 6;
  const v = clamp((availH - FIXED) / (176 * n + 52), 0.28, 1.8);
  ROW = 88 * v; BAR_H = 44 * v; ADD_H = 52 * v; CROW = 88 * v; CR = 36 * v;

  const font = Math.min(ROW / 2.4, clamp((compact ? 28 : 32) * v, 13, compact ? 34 : 44));
  DY = font * 0.7;                        // denominator center below the fraction bar
  L = { W, compact, sx, bm: sx - bo, bp: sx + bo, font, v,
        btnR: clamp((compact ? 14 : 15) * v, 9, 19), hitR: clamp(22 * v, 12, 24),
        X0: sx + bo + (compact ? 34 : 44), X1: W - (compact ? 50 : 72) };
  L.LW = L.X1 - L.X0;
}

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const X = v => L.X0 + v / M * L.LW;
function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function txt(x, y, s, size, color) {
  const t = el('text', { x, y, 'font-size': size, fill: color, 'text-anchor': 'middle', 'pointer-events': 'none' });
  t.textContent = s;
}
const polar = (cx, cy, r, q) => {   // point at fraction q of a turn, starting at 12 o'clock, clockwise
  const a = (-90 + q * 360) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
};
function sector(cx, cy, r, q0, q1) {
  const [x0, y0] = polar(cx, cy, r, q0), [x1, y1] = polar(cx, cy, r, q1);
  return `M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${q1 - q0 > 0.5 ? 1 : 0} 1 ${x1},${y1} Z`;
}
function svgPoint(cx, cy) {
  const p = svg.createSVGPoint(); p.x = cx; p.y = cy;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
// Round − / + / × button with a large invisible touch area.
function button(cx, cy, kind, color, enabled, data) {
  const c = enabled ? color : FAINT;
  el('circle', { cx, cy, r: L.btnR, fill: 'none', stroke: c, 'stroke-width': 1.5, 'pointer-events': 'none' });
  const s = L.btnR * 0.45;
  let d = `M${cx - s},${cy} L${cx + s},${cy}`;
  if (kind === '+') d += ` M${cx},${cy - s} L${cx},${cy + s}`;
  if (kind === 'x') d = `M${cx - s * 0.8},${cy - s * 0.8} L${cx + s * 0.8},${cy + s * 0.8} M${cx + s * 0.8},${cy - s * 0.8} L${cx - s * 0.8},${cy + s * 0.8}`;
  el('path', { d, stroke: c, 'stroke-width': 2, 'stroke-linecap': 'round', 'pointer-events': 'none' });
  if (enabled) el('circle', { cx, cy, r: L.hitR, fill: 'transparent', class: 'hit', ...data });
}
// Number of wholes that fits all fractions, with room after an exact whole.
function fit() {
  const maxV = Math.max(0, ...fr.map(f => f.n / f.d));
  return clamp(Math.ceil(maxV + 1e-9), 1, MAX_M);
}

// ---------- denominator inputs (HTML on top of the SVG) ----------
function syncInputs() {
  for (const [f, inp] of inputs) if (!fr.includes(f)) { inp.remove(); inputs.delete(f); }
  fr.forEach((f, i) => {
    let inp = inputs.get(f);
    if (!inp) {
      inp = document.createElement('input');
      Object.assign(inp, { type: 'text', inputMode: 'numeric', pattern: '[0-9]*', maxLength: 3, className: 'den', autocomplete: 'off' });
      inp.setAttribute('aria-label', 'denominator');
      inp.name = 'den' + f.c;
      inp.addEventListener('input', () => {
        const v = parseInt(inp.value, 10);
        if (v >= 1 && v <= MAX_D) setDen(f, v);
      });
      inp.addEventListener('focus', () => inp.select());
      inp.addEventListener('blur', () => { inp.value = f.d; });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') inp.blur();
        if (e.key === 'ArrowUp') { e.preventDefault(); setDen(f, f.d + 1); inp.value = f.d; }
        if (e.key === 'ArrowDown') { e.preventDefault(); setDen(f, f.d - 1); inp.value = f.d; }
      });
      wrap.appendChild(inp);
      inputs.set(f, inp);
    }
    const cy = TOP + i * ROW + ROW / 2;
    Object.assign(inp.style, { left: L.sx + 'px', top: (cy + DY) + 'px', width: (L.font * 2.1) + 'px',
      height: (L.font * 1.35) + 'px', fontSize: L.font + 'px', color: COLORS[f.c] });
    if (document.activeElement !== inp) inp.value = f.d;
  });
}
function setDen(f, d) {
  f.d = clamp(d, 1, MAX_D);
  f.n = Math.min(f.n, MAX_M * f.d);
  active = fr.indexOf(f);
  settle();
}

// ---------- render ----------
function render() {
  layout();
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const { W, X0, X1, LW, sx } = L;
  const n = fr.length;
  const addY = TOP + n * ROW;
  LY = addY + ADD_H + 36;
  const cTop = LY + 64;
  const H = cTop + n * CROW + 2;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  const defs = el('defs', {});
  const cp = el('clipPath', { id: 'clip' }, defs);
  el('rect', { x: X0 - 3, y: 0, width: LW + 6, height: LY }, cp);

  // --- bars (top) ---
  fr.forEach((f, i) => {
    const col = COLORS[f.c], cy = TOP + i * ROW + ROW / 2, by = cy - BAR_H / 2;
    const v = f.n / f.d, sv = f.sv;
    const full = Math.max(1, Math.ceil(Math.max(v, sv) - 1e-9));
    const wholes = Math.max(full, Math.ceil(M - 1e-9));
    const ww = LW / M, pw = ww / f.d;
    const g = el('g', { 'clip-path': 'url(#clip)' });

    // smooth fill
    el('rect', { x: X0, y: by, width: Math.max(0, sv * ww), height: BAR_H, fill: col, 'fill-opacity': FILL_OP }, g);
    // pieces: faint ones first, then the used wholes on top
    for (const used of [false, true]) {
      if (pw >= 3) {
        for (let k = 0; k < wholes * f.d; k++) {
          if ((Math.floor(k / f.d) < full) !== used) continue;
          el('rect', { x: X0 + k * pw, y: by, width: pw, height: BAR_H, fill: 'transparent',
            stroke: used ? col : FAINT, 'stroke-width': pw < 8 ? 1 : 1.5,
            class: 'hit', 'data-act': 'piece', 'data-i': i, 'data-k': k }, g);
        }
      } else {
        for (let w = 0; w < wholes; w++) {
          if ((w < full) !== used) continue;
          el('rect', { x: X0 + w * ww, y: by, width: ww, height: BAR_H, fill: 'none', stroke: used ? col : FAINT, 'stroke-width': 1.5 }, g);
        }
      }
    }
    for (let w = 0; w <= full; w++) {   // stronger lines between wholes
      const x = X0 + w * ww;
      el('line', { x1: x, y1: by, x2: x, y2: by + BAR_H, stroke: col, 'stroke-width': 3, 'pointer-events': 'none' }, g);
    }
    // dashed guide from the end of the fill down to the number line
    el('line', { x1: X(sv), y1: by + BAR_H, x2: X(sv), y2: LY, stroke: col, 'stroke-width': 1.5,
      'stroke-dasharray': '4 6', opacity: 0.55, 'pointer-events': 'none' });

    // fraction symbol: numerator, bar, (denominator is an HTML input), − / + buttons
    txt(sx, cy - L.font * 0.28, f.n, L.font, col);
    el('line', { x1: sx - L.font * 0.9, y1: cy, x2: sx + L.font * 0.9, y2: cy, stroke: col, 'stroke-width': 2 });
    button(L.bm, cy + DY, '-', col, f.d > 1, { 'data-act': 'down', 'data-i': i });
    button(L.bp, cy + DY, '+', col, f.d < MAX_D, { 'data-act': 'up', 'data-i': i });

    if (n > 1) button(X1 + (W - X1) / 2, cy, 'x', DIM, true, { 'data-act': 'rm', 'data-i': i });
  });

  // add (+)
  if (n < COLORS.length) button(sx, addY + ADD_H / 2, '+', DIM, true, { 'data-act': 'add' });

  // --- number line (middle) ---
  const tipX = X1 + 26;
  el('line', { x1: X0 - 14, y1: LY, x2: tipX - 8, y2: LY, stroke: FG, 'stroke-width': 2 });
  el('path', { d: `M${tipX},${LY} L${tipX - 13},${LY - 6} L${tipX - 13},${LY + 6} Z`, fill: FG });
  fr.forEach(f => {                      // fraction marks cross the line, in the color of each fraction
    const sp = LW / M / f.d;
    if (sp < 5) return;
    for (let k = 0; k <= M * f.d + 1e-9; k++) {
      const x = X0 + k * sp;
      el('line', { x1: x, y1: LY - 9, x2: x, y2: LY + 9, stroke: COLORS[f.c], 'stroke-width': 2, opacity: 0.9 });
    }
  });
  const step = M <= 10 ? 1 : M <= 20 ? 2 : 5;
  for (let w = 0; w <= Math.floor(M + 1e-9); w++) {   // whole numbers
    const x = X(w);
    el('line', { x1: x, y1: LY - 14, x2: x, y2: LY + 14, stroke: FG, 'stroke-width': 2 });
    if (w % step === 0) txt(x, LY + 44, w, 26, FG);
  }
  el('rect', { x: X0 - 30, y: LY - 34, width: W - X0 + 30, height: 68, fill: 'transparent', class: 'drag' });
  const order = fr.map((_, i) => i).filter(i => i !== active).concat(active < n ? [active] : []);
  order.forEach(i => {
    const f = fr[i];
    el('circle', { cx: X(f.sv), cy: LY, r: i === active ? 10 : 8, fill: COLORS[f.c], stroke: '#0b0b0d', 'stroke-width': 2.5, 'pointer-events': 'none' });
  });

  // --- circles (bottom) ---
  fr.forEach((f, i) => {
    const col = COLORS[f.c], v = f.n / f.d, sv = f.sv;
    const cnt = Math.max(1, Math.ceil(Math.max(v, sv) - 1e-9));
    const r = clamp((LW / cnt - 10) / 2, 4, CR), cy = cTop + i * CROW + CROW / 2 - 4;
    const thin = 2 * Math.PI * r / f.d < 4;
    for (let w = 0; w < cnt; w++) {
      const cx = X0 + r + w * (2 * r + 10);
      const q = clamp(sv - w, 0, 1);
      // smooth fill
      if (q >= 0.9999) el('circle', { cx, cy, r, fill: col, 'fill-opacity': FILL_OP });
      else if (q > 0.0001) el('path', { d: sector(cx, cy, r, 0, q), fill: col, 'fill-opacity': FILL_OP });
      // slice lines and outline
      if (!thin && f.d > 1) {
        let d = '';
        for (let j = 0; j < f.d; j++) { const [x, y] = polar(cx, cy, r, j / f.d); d += `M${cx},${cy} L${x},${y} `; }
        el('path', { d, stroke: col, 'stroke-width': r < 15 || f.d > 24 ? 1 : 1.5, opacity: 0.85, 'pointer-events': 'none' });
      }
      el('circle', { cx, cy, r, fill: 'none', stroke: col, 'stroke-width': 2, 'pointer-events': 'none' });
      // invisible touch areas for each slice
      if (!thin) for (let j = 0; j < f.d; j++) {
        const attrs = { fill: 'transparent', class: 'hit', 'data-act': 'piece', 'data-i': i, 'data-k': w * f.d + j };
        if (f.d === 1) el('circle', { cx, cy, r, ...attrs });
        else el('path', { d: sector(cx, cy, r, j / f.d, (j + 1) / f.d), ...attrs });
      }
    }
  });

  syncInputs();
}

// ---------- animation loop: smooth fill, smooth dot, smooth zoom ----------
function kick() {
  if (running) return;
  running = true; last = performance.now();
  requestAnimationFrame(tick);
}
function tick(now) {
  const dt = Math.min(50, now - last); last = now;
  const k = 1 - Math.exp(-dt / 70);       // easing: about 70 ms time constant
  let moving = false;
  if (drag) {
    if (drag.px > L.X1 + 6 && M < MAX_M) {   // held past the end: zoom out
      M = Math.min(MAX_M, M * Math.exp(0.7 * dt / 1000));
      Mt = M; snapDrag(); moving = true;
    }
  } else if (Math.abs(Mt - M) > 1e-4) { M += (Mt - M) * k; moving = true; }
  else M = Mt;
  for (const f of fr) {
    const t = f.n / f.d;
    if (Math.abs(t - f.sv) > 1e-4) { f.sv += (t - f.sv) * k; moving = true; } else f.sv = t;
  }
  render();
  if (moving || drag) requestAnimationFrame(tick); else running = false;
}
function settle() { Mt = fit(); kick(); }

// ---------- actions ----------
function doAction(ds) {
  const i = +ds.i;
  if (ds.act === 'add') {
    const used = new Set(fr.map(f => f.c));
    const c = COLORS.findIndex((_, k) => !used.has(k));
    fr.push({ n: 1, d: [3, 2, 6, 8, 5][fr.length - 1] || 4, c, sv: 0 });
    active = fr.length - 1;
  } else if (ds.act === 'rm') {
    fr.splice(i, 1); active = Math.min(active, fr.length - 1);
  } else if (ds.act === 'up' || ds.act === 'down') {
    setDen(fr[i], fr[i].d + (ds.act === 'up' ? 1 : -1)); return;
  } else if (ds.act === 'piece') {
    const f = fr[i], k = +ds.k;
    f.n = (f.n === k + 1) ? k : k + 1;
    active = i;
  }
  settle();
}

// ---------- pointer input ----------
const nearLine = p => Math.abs(p.y - LY) < 34 && p.x > L.X0 - 30;

function snapDrag() {
  const f = fr[drag.i];
  const v = (drag.px - L.X0) / L.LW * M;
  f.n = clamp(Math.round(v * f.d), 0, Math.floor(M * f.d + 1e-9));
}

svg.addEventListener('pointerdown', e => {
  if (document.activeElement && document.activeElement.classList.contains('den')) document.activeElement.blur();
  const ds = e.target.dataset || {};
  if (ds.act) { tap = { ds: { ...ds }, x: e.clientX, y: e.clientY }; return; }
  const p = svgPoint(e.clientX, e.clientY);
  if (!nearLine(p)) return;
  let best = active, bd = Infinity;
  fr.forEach((f, i) => {
    const dd = Math.abs(X(f.sv) - p.x) - (i === active ? 0.5 : 0);
    if (dd < bd) { bd = dd; best = i; }
  });
  drag = { i: best, px: p.x }; active = best; Mt = M;
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  snapDrag(); kick();
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.px = svgPoint(e.clientX, e.clientY).x;
  snapDrag(); kick();
});
svg.addEventListener('pointerup', e => {
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 12) doAction(tap.ds);
  tap = null;
  if (drag) { drag = null; settle(); }
});
svg.addEventListener('pointercancel', () => {   // e.g. the page started to scroll
  tap = null;
  if (drag) { drag = null; settle(); }
});
// Touch: block page scroll only when the finger starts on the number line.
svg.addEventListener('touchstart', e => {
  const t = e.touches[0];
  if (e.touches.length === 1 && nearLine(svgPoint(t.clientX, t.clientY))) e.preventDefault();
}, { passive: false });
svg.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });

// ---------- start ----------
new ResizeObserver(() => { if (wrap.clientWidth !== L.W) render(); }).observe(wrap);
window.addEventListener('resize', render);
window.addEventListener('orientationchange', () => setTimeout(render, 100));
if (document.fonts) document.fonts.ready.then(render);
M = Mt = fit();
render();
</script>
</body>
</html>
